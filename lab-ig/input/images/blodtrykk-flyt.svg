<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Flyten for blodtrykk hjemme</title>
  <desc id="d">Karin måler blodtrykk i målerappen. Målingen sendes til journalsystemet med status innsendt. Sykepleier Sara ser målingen, vurderer den og journalfører den med status vurdert.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="780" height="420" fill="#ffffff"/>

  <!-- Livslinjer -->
  <g stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="90" y1="60" x2="90" y2="400"/>
    <line x1="270" y1="60" x2="270" y2="400"/>
    <line x1="480" y1="60" x2="480" y2="400"/>
    <line x1="690" y1="60" x2="690" y2="400"/>
  </g>

  <!-- Aktører -->
  <g stroke-width="1.5" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="25" y="20" width="130" height="40" rx="6" fill="#fff3e0" stroke="#e65100"/>
    <text x="90" y="45" fill="#7a2e00">Karin (pasient)</text>
    <rect x="205" y="20" width="130" height="40" rx="6" fill="#fff3e0" stroke="#e65100"/>
    <text x="270" y="45" fill="#7a2e00">Målerapp</text>
    <rect x="415" y="20" width="130" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="480" y="45" fill="#0d3c75">Journalsystem</text>
    <rect x="625" y="20" width="130" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="690" y="45" fill="#1b5e20">Sara (sykepleier)</text>
  </g>

  <!-- Piler -->
  <g stroke="#37474f" stroke-width="2" marker-end="url(#a)">
    <line x1="90" y1="130" x2="268" y2="130"/>
    <line x1="270" y1="200" x2="478" y2="200"/>
    <line x1="690" y1="270" x2="482" y2="270"/>
    <line x1="690" y1="340" x2="482" y2="340"/>
  </g>

  <!-- Tekst -->
  <g font-size="13" fill="#263238" text-anchor="middle">
    <text x="180" y="120">1. Måler blodtrykk</text>

    <text x="375" y="172">2. Sender inn måling</text>
    <text x="375" y="188" fill="#b45309" font-weight="bold">status: innsendt</text>

    <text x="585" y="260">3. Ser innkommende målinger</text>

    <text x="585" y="312">4. Vurderer og journalfører</text>
    <text x="585" y="328" fill="#2e7d32" font-weight="bold">status: vurdert</text>
  </g>

  <!-- Forklaring -->
  <text x="390" y="408" font-size="11" fill="#607d8b" text-anchor="middle">Målinger fra pasienten er en del av journalen først etter at helsepersonell har vurdert dem.</text>
</svg>
